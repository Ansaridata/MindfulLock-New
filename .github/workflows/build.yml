name: Build MindfulLock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Android Project
        run: |
          mkdir -p app/src/main/java/com/ansaridata/mindfullock
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          rootProject.name = "MindfulLock"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.ansaridata.mindfullock'
              compileSdkVersion 34
              defaultConfig {
                  applicationId "com.ansaridata.mindfullock"
                  minSdkVersion 24
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.10.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="MindfulLock"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MindfulLock</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="MindfulLock"
                  android:textSize="32sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp"/>

              <EditText
                  android:id="@+id/reasonInput"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Reason for use (e.g., Check email)"
                  android:layout_marginBottom="16dp"/>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:layout_marginBottom="32dp">
                  <EditText
                      android:id="@+id/minutesInput"
                      android:layout_width="0dp"
                      android:layout_weight="1"
                      android:layout_height="wrap_content"
                      android:inputType="number"
                      android:hint="Minutes"/>
                  <EditText
                      android:id="@+id/secondsInput"
                      android:layout_width="0dp"
                      android:layout_weight="1"
                      android:layout_height="wrap_content"
                      android:inputType="number"
                      android:hint="Seconds"/>
              </LinearLayout>

              <Button
                  android:id="@+id/unlockBtn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Intentional Unlock"
                  android:layout_marginBottom="16dp"/>

              <Button
                  android:id="@+id/tempBtn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Temp 60s Pass"
                  android:backgroundTint="#FF5722"/>

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/ansaridata/mindfullock/MainActivity.kt
          package com.ansaridata.mindfullock

          import android.os.Bundle
          import android.os.CountDownTimer
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val reasonInput = findViewById<EditText>(R.id.reasonInput)
                  val minutesInput = findViewById<EditText>(R.id.minutesInput)
                  val secondsInput = findViewById<EditText>(R.id.secondsInput)
                  val unlockBtn = findViewById<Button>(R.id.unlockBtn)
                  val tempBtn = findViewById<Button>(R.id.tempBtn)

                  unlockBtn.setOnClickListener {
                      val reason = reasonInput.text.toString()
                      val m = minutesInput.text.toString().toLongOrNull() ?: 0L
                      val s = secondsInput.text.toString().toLongOrNull() ?: 0L
                      
                      if (reason.isBlank()) {
                          Toast.makeText(this, "Please enter a reason", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      
                      val totalMs = (m * 60 + s) * 1000
                      if (totalMs <= 0) {
                          Toast.makeText(this, "Please enter a valid time", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      startSession(reason, totalMs)
                  }

                  tempBtn.setOnClickListener {
                      startSession("Emergency 60s Pass", 60000)
                  }
              }

              private fun startSession(reason: String, durationMs: Long) {
                  Toast.makeText(this, "Unlocked for: $reason", Toast.LENGTH_SHORT).show()
                  
                  object : CountDownTimer(durationMs, 1000) {
                      override fun onTick(millisUntilFinished: Long) {}
                      override fun onFinish() {
                          Toast.makeText(this@MainActivity, "Time is up! Device Locking...", Toast.LENGTH_LONG).show()
                          finishAffinity() 
                      }
                  }.start()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindfulLock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
